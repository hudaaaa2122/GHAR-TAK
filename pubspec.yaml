name: ghertak_mobile
description: Gher Tak customer mobile app (Android & iOS) — Flutter UI matching Figma 2026.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0+3
  image_picker: ^1.2.3
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  speech_to_text: ^7.5.0
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  webview_flutter: ^4.14.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/figma/logos/
    - assets/figma/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
